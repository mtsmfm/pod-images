name: build

# pod-base (3 variants) -> pod-lyra2 (cu128, torch 2.7.1) / pod-comfy (cu128 torch 2.8.0, cu130 torch
# 2.9.1) / pod-train (cu128, torch 2.8.0). pod-lyra2-rp builds on RunPod's image and does not wait for
# pod-base. Each build: image.yml. A pull request builds everything under :<tag>-pr<number>.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build (the others use their last pushed pod-base)
        type: choice
        options: [all, base, lyra2, comfy, train, lyra2-rp]
        default: all
  push:
    branches: [main]
    paths: &paths
      - "base/**"
      - "lyra2/**"
      - "lyra2-rp/**"
      - "comfy/**"
      - "train/**"
      - ".github/workflows/*.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  base:
    if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'base'
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cu128
            cache_tag: buildcache
            torch: 2.7.1
            torchvision: 0.22.1
          - tag: cu128-torch280
            cache_tag: buildcache-torch280
            torch: 2.8.0
            torchvision: 0.23.0
          - tag: cu130
            cache_tag: buildcache-cu130
            torch: 2.9.1
            torchvision: 0.24.1
            torch_index: cu130
            cuda_images: |
              BUILDER_IMAGE=nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04
              RUNTIME_IMAGE=nvidia/cuda:13.0.3-base-ubuntu22.04
    uses: ./.github/workflows/image.yml
    with:
      image: pod-base
      builder_image: pod-base-builder
      context: base
      tag: ${{ matrix.tag }}
      cache_tag: ${{ matrix.cache_tag }}
      build_args: |
        TORCH=${{ matrix.torch }}
        TORCHVISION=${{ matrix.torchvision }}
        TORCH_INDEX=${{ matrix.torch_index || 'cu128' }}
        ${{ matrix.cuda_images }}
      size_limit_gb: 5

  # When only one derived image is selected, base is skipped; run anyway in that case
  lyra2:
    needs: [base]
    if: |
      always() &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'lyra2')
    uses: ./.github/workflows/image.yml
    with:
      image: pod-lyra2
      context: lyra2
      tag: cu128
      base_tag: cu128
      size_limit_gb: 7

  comfy:
    needs: [base]
    if: |
      always() &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'comfy')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Any host whose driver supports CUDA 12.8 (comfy-kitchen built from source with 12.8)
          - tag: cu128
            base_tag: cu128-torch280
            cache_tag: buildcache
            torch_cuda: "12.8"
          # Hosts with a CUDA 13.0 driver (580+): comfy-kitchen's CUDA kernels are used
          - tag: cu130
            base_tag: cu130
            cache_tag: buildcache-cu130
            torch_cuda: "13.0"
    uses: ./.github/workflows/image.yml
    with:
      image: pod-comfy
      context: comfy
      tag: ${{ matrix.tag }}
      base_tag: ${{ matrix.base_tag }}
      cache_tag: ${{ matrix.cache_tag }}
      build_args: |
        TORCH_CUDA=${{ matrix.torch_cuda }}
      size_limit_gb: 6

  train:
    needs: [base]
    if: |
      always() &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'train')
    uses: ./.github/workflows/image.yml
    with:
      image: pod-train
      context: train
      tag: cu128
      base_tag: cu128-torch280
      size_limit_gb: 6

  # Experiment: Lyra on RunPod's PyTorch image (does not use pod-base). Shares lyra2/'s install files.
  lyra2-rp:
    if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'lyra2-rp'
    uses: ./.github/workflows/image.yml
    with:
      image: pod-lyra2-rp
      context: lyra2-rp
      tag: cu128
      build_contexts: |
        lyra2=lyra2
