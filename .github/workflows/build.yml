name: build

on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        options: [all, base, lyra2]
        default: all
  push:
    branches: [main]
    paths:
      - "base/**"
      - "lyra2/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TAG: cu128

jobs:
  base:
    if: github.event_name == 'push' || inputs.image == 'all' || inputs.image == 'base'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: df -h /

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pod-base:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pod-base:${{ env.TAG }}-${{ github.run_number }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/pod-base:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/pod-base:buildcache,mode=max

  lyra2:
    needs: [base]
    # When only lyra2 is selected, base is skipped; run anyway in that case
    if: |
      always() &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (github.event_name == 'push' || inputs.image == 'all' || inputs.image == 'lyra2')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: df -h /

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: lyra2
          platforms: linux/amd64
          push: true
          build-args: |
            BASE=ghcr.io/${{ env.OWNER }}/pod-base:${{ env.TAG }}
          tags: |
            ghcr.io/${{ env.OWNER }}/pod-lyra2:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pod-lyra2:${{ env.TAG }}-${{ github.run_number }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/pod-lyra2:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/pod-lyra2:buildcache,mode=max
