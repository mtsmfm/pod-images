name: image

# Builds one image and pushes it to ghcr.io/OWNER/<image>:<tag> and :<tag>-<run number>.
# Called by build.yml once per image (and per variant). For a pull request, only to :<tag>-pr<number>
# (built on pod-base*:<base_tag>-pr<number>), so a PR can be checked without touching the real tags.
# All share one registry cache per image, so merging a checked PR reuses its layers.
# With zstd: true, the same build is also pushed with zstd layers to :<tag>-zstd and :<tag>-zstd-<run
# number> (:<tag>-zstd-pr<number> for a PR), then checked against the gzip tag and run.
on:
  workflow_call:
    inputs:
      image:
        description: Package name, e.g. pod-comfy
        type: string
        required: true
      context:
        description: Directory with the Dockerfile
        type: string
        required: true
      tag:
        description: Tag to push, e.g. cu128 or cu128-torch280
        type: string
        required: true
      base_tag:
        description: Build on ghcr.io/OWNER/pod-base-builder:<base_tag> and pod-base:<base_tag>
        type: string
        default: ""
      build_args:
        type: string
        default: ""
      build_contexts:
        type: string
        default: ""
      builder_image:
        description: Also push the Dockerfile's builder stage under this package name
        type: string
        default: ""
      cache_tag:
        description: Registry cache at ghcr.io/OWNER/<image>:<cache_tag>
        type: string
        default: buildcache
      zstd:
        description: Also push the image with zstd layers (level 3) to :<tag>-zstd
        type: boolean
        default: false
      zstd_check:
        description: Script in the context directory run in the pulled zstd image (bash SCRIPT ARGS...)
        type: string
        default: ""
      zstd_check_args:
        type: string
        default: ""
      size_limit_gb:
        description: Warn (without failing) when the compressed size is above this; 0 for none
        type: number
        default: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Keep swap: compiling the CUDA extensions (ViPE) can run out of the 16 GB of RAM, and the
          # runner is then shut down without an error pointing here
          swap-storage: false

      - run: df -h /

      - name: Owner, tags, build arguments
        env:
          TAG: ${{ inputs.tag }}
          BASE_TAG: ${{ inputs.base_tag }}
          BUILD_ARGS: ${{ inputs.build_args }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          suffix=${PR:+-pr$PR}
          echo "OWNER=$owner" >> "$GITHUB_ENV"
          echo "TAG=$TAG$suffix" >> "$GITHUB_ENV"
          # The run-number tag only for real builds
          if [ -z "$suffix" ]; then echo "RUN_TAG=$TAG-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"; else echo "RUN_TAG=$TAG$suffix" >> "$GITHUB_ENV"; fi
          echo "ZSTD_TAG=$TAG-zstd$suffix" >> "$GITHUB_ENV"
          if [ -z "$suffix" ]; then echo "ZSTD_RUN_TAG=$TAG-zstd-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"; else echo "ZSTD_RUN_TAG=$TAG-zstd$suffix" >> "$GITHUB_ENV"; fi
          {
            echo "BUILD_ARGS<<EOF"
            if [ -n "$BASE_TAG" ]; then
              echo "BUILDER=ghcr.io/$owner/pod-base-builder:$BASE_TAG$suffix"
              echo "BASE=ghcr.io/$owner/pod-base:$BASE_TAG$suffix"
            fi
            if [ -n "$BUILD_ARGS" ]; then echo "$BUILD_ARGS"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pod-base only: the builder stage (CUDA devel + torch) is the FROM of every derived builder stage
      - name: Build and push ${{ inputs.builder_image }}
        if: inputs.builder_image != ''
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context }}
          target: builder
          platforms: linux/amd64
          push: true
          # No provenance attestation: it records the run, so every push gave pod-base a new digest even
          # when every layer came from the cache, and the derived images' cache (keyed by the FROM
          # digest) then missed and rebuilt everything
          provenance: false
          build-args: ${{ env.BUILD_ARGS }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ inputs.builder_image }}:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/${{ inputs.builder_image }}:${{ env.RUN_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ inputs.cache_tag }}

      # The last stage (runtime): what pods run. The builder stage of a derived image stays in the cache.
      - name: Build and push ${{ inputs.image }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build_contexts }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ env.BUILD_ARGS }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ env.RUN_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ inputs.cache_tag }}
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ inputs.cache_tag }},mode=max

      # The same build again, every layer from this builder's cache (so the files are the same), written
      # with zstd. force-compression recompresses the layers from FROM too, which are gzip otherwise.
      - name: Push ${{ inputs.image }} with zstd layers
        if: inputs.zstd
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build_contexts }}
          platforms: linux/amd64
          provenance: false
          build-args: ${{ env.BUILD_ARGS }}
          outputs: type=image,"name=ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ env.ZSTD_TAG }},ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ env.ZSTD_RUN_TAG }}",push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ inputs.image }}:${{ inputs.cache_tag }}

      - run: df -h /

      - name: Compressed size
        env:
          SIZE_LIMIT_GB: ${{ inputs.size_limit_gb }}
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          IMAGE: ${{ inputs.image }}
          ZSTD: ${{ inputs.zstd }}
        run: |
          if [ -n "$BUILDER_IMAGE" ]; then
            SIZE_LIMIT_GB=0 .github/scripts/image-size.sh "ghcr.io/$OWNER/$BUILDER_IMAGE:$TAG"
          fi
          .github/scripts/image-size.sh "ghcr.io/$OWNER/$IMAGE:$TAG"
          if [ "$ZSTD" = true ]; then SIZE_LIMIT_GB=0 .github/scripts/image-size.sh "ghcr.io/$OWNER/$IMAGE:$ZSTD_TAG"; fi

      # Layer types, the same diff_ids as the gzip tag, pull times (2 each), then the checks in the image
      - name: Check the zstd image
        if: inputs.zstd
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          CHECK: ${{ inputs.zstd_check }}
          CHECK_ARGS: ${{ inputs.zstd_check_args }}
        run: |
          .github/scripts/zstd-check.sh "ghcr.io/$OWNER/$IMAGE:$TAG" "ghcr.io/$OWNER/$IMAGE:$ZSTD_TAG" 2
          if [ -n "$CHECK" ]; then
            # shellcheck disable=SC2086
            docker run --rm -v "$PWD/$CONTEXT:/tmp/ctx:ro" "ghcr.io/$OWNER/$IMAGE:$ZSTD_TAG" bash "/tmp/ctx/$CHECK" $CHECK_ARGS
          fi
